<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration and Login</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow p-4">
                <h3 class="text-center mb-3">Registration Form</h3>

                <div class="text-center mb-3">
                    <button class="btn btn-primary" onclick="showLogin()">Login</button>
                    <button class="btn btn-secondary" onclick="showRegister()">Register</button>
                </div>

                
                <form id="loginForm">
                    <h5>Login</h5>

                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" id="loginEmail" required>
                    </div>

                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password" class="form-control" id="loginPassword" required>
                    </div>

                    <button class="btn btn-success w-100">Log In</button>
                </form>

                <form id="registerForm" class="hidden">
                    <h5>Register</h5>

                    <div class="mb-2">
                        <label>Full Name</label>
                        <input type="text" class="form-control" id="regName" required>
                    </div>

                    <div class="mb-2">
                        <label>Username</label>
                        <input type="text" class="form-control" id="regUsername" required>
                    </div>

                    <div class="mb-2">
                        <label>Email</label>
                        <input type="email" class="form-control" id="regEmail" required>
                    </div>

                    <div class="mb-2">
                        <label>Password</label>
                        <input type="password" class="form-control" id="regPassword" required>
                    </div>

                    <div class="mb-2">
                        <label>Gender</label>
                        <select class="form-control" id="regGender">
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Birthdate</label>
                        <input type="date" class="form-control" id="regBirth">
                    </div>

                    <button class="btn btn-primary w-100">Register</button>
                </form>

            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
